/* Navbar */
 
.navbar{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
background:rgba(16,25,40,.9);
padding:12px 24px;
border-radius:50px;

}

height:180px;
border-radius:50%;

margin-bottom:10px;
}
 
.hero h2{

}

gap:12px;
flex-wrap:wrap;

}
 
.btn{
background:#4fd1c5;
color:#000;
padding:12px 20px;
border-radius:10px;
text-decoration:none;
font-weight:600;
}
 
.btn:hover{
opacity:.9;
}
 
@media(max-width:768px){
 
.navbar{
flex-wrap:wrap;
width:95%;
justify-content:center;
}
